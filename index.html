<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EroDev - App Builder</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0f172a;
    color: white;
}

header {
    background: #2563eb;
    padding: 15px;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
}

.container {
    display: flex;
    height: calc(100vh - 60px);
}

.editor {
    width: 50%;
    padding: 10px;
    box-sizing: border-box;
}

textarea {
    width: 100%;
    height: 30%;
    margin-bottom: 10px;
    background: #111827;
    color: #fff;
    border: 1px solid #334155;
    padding: 10px;
    border-radius: 8px;
}

iframe {
    width: 50%;
    height: 100%;
    border: none;
    background: white;
}

button {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    background: #22c55e;
    border: none;
    color: white;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
}

.project-list {
    margin-top: 10px;
    font-size: 14px;
}

.project-item {
    background: #1e293b;
    padding: 5px;
    margin-top: 5px;
    border-radius: 5px;
    cursor: pointer;
}
</style>
</head>

<body>

<header>⚡ EroDev - App Builder (HTML/CSS/JS)</header>

<div class="container">

<div class="editor">

<h3>HTML</h3>
<textarea id="html"></textarea>

<h3>CSS</h3>
<textarea id="css"></textarea>

<h3>JS</h3>
<textarea id="js"></textarea>

<button onclick="runCode()">▶ Run App</button>
<button onclick="saveProject()">💾 Save Project</button>

<div class="project-list" id="projects"></div>

</div>

<iframe id="output"></iframe>

</div>

<script>

function runCode() {
    let html = document.getElementById("html").value;
    let css = "<style>" + document.getElementById("css").value + "</style>";
    let js = "<script>" + document.getElementById("js").value + "<\/script>";

    let output = document.getElementById("output").contentWindow.document;
    output.open();
    output.write(html + css + js);
    output.close();
}

let projects = JSON.parse(localStorage.getItem("erodev_projects") || "[]");

function saveProject() {
    let name = prompt("Non pwojè a:");
    if (!name) return;

    let project = {
        name,
        html: document.getElementById("html").value,
        css: document.getElementById("css").value,
        js: document.getElementById("js").value
    };

    projects.push(project);
    localStorage.setItem("erodev_projects", JSON.stringify(projects));
    loadProjects();
}

function loadProjects() {
    let list = document.getElementById("projects");
    list.innerHTML = "<b>📂 Pwojè ou yo:</b>";

    projects.forEach((p, i) => {
        let div = document.createElement("div");
        div.className = "project-item";
        div.innerText = p.name;

        div.onclick = () => {
            document.getElementById("html").value = p.html;
            document.getElementById("css").value = p.css;
            document.getElementById("js").value = p.js;
        };

        list.appendChild(div);
    });
}

loadProjects();

</script>

</body>
</html>
