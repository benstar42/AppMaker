<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EroDev Sketch-Like</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0a0f1f;
    color: white;
}

header {
    background: #7c3aed;
    padding: 15px;
    text-align: center;
    font-weight: bold;
}

.container {
    display: flex;
    height: calc(100vh - 60px);
}

.left {
    width: 40%;
    padding: 10px;
}

.right {
    width: 60%;
    background: white;
}

input, textarea, button {
    width: 100%;
    margin-top: 10px;
    padding: 10px;
    border-radius: 8px;
    border: none;
}

textarea {
    height: 120px;
    background: #111827;
    color: white;
}

button {
    background: #22c55e;
    font-weight: bold;
}

.block {
    background: #1e293b;
    padding: 10px;
    margin-top: 5px;
    border-radius: 8px;
    cursor: pointer;
}

iframe {
    width: 100%;
    height: 100%;
    border: none;
}
</style>
</head>

<body>

<header>⚡ EroDev Sketch-Like Builder</header>

<div class="container">

<!-- LEFT -->
<div class="left">

<input id="appName" placeholder="📱 App Name">

<h3>🧱 Blocks (simple)</h3>

<div class="block" onclick="addBlock('button')">➕ Button</div>
<div class="block" onclick="addBlock('text')">📝 Text</div>
<div class="block" onclick="addBlock('image')">🖼 Image</div>

<textarea id="code" placeholder="App code ap parèt la"></textarea>

<button onclick="preview()">👁 Preview</button>
<button onclick="buildAPK()">📦 Build APK Project</button>

</div>

<!-- RIGHT -->
<div class="right">
<iframe id="preview"></iframe>
</div>

</div>

<script>

function addBlock(type){

let c = code.value;

if(type === "button"){
c += `<button onclick="alert('Click!')">Button</button>\n`;
}

if(type === "text"){
c += `<h2>Hello Text</h2>\n`;
}

if(type === "image"){
c += `<img src="https://via.placeholder.com/300">\n`;
}

code.value = c;
}

// 👁 PREVIEW
function preview(){
let doc = document.getElementById("preview").contentWindow.document;
doc.open();
doc.write(code.value);
doc.close();
}

// 📦 BUILD APK PROJECT
function buildAPK(){

let name = appName.value || "EroApp";

let zip = new JSZip();

zip.file("www/index.html", `
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>${name}</title>
</head>
<body>
${code.value}
</body>
</html>
`);

zip.file("BUILD.txt", `
Sketch-like Project

Use Capacitor:
npx cap add android
npx cap open android

OR Cordova:
cordova build android
`);

zip.generateAsync({type:"blob"}).then(blob=>{
let a = document.createElement("a");
a.href = URL.createObjectURL(blob);
a.download = name+"_SketchLike.zip";
a.click();
});

}

</script>

</body>
</html>
