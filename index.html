<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EroDev Visual Builder</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0b1020;
    color: white;
    display: flex;
}

.panel {
    width: 25%;
    background: #111827;
    padding: 10px;
    height: 100vh;
    overflow: auto;
}

.canvas {
    width: 50%;
    background: white;
    height: 100vh;
    position: relative;
}

.prop {
    width: 25%;
    background: #1f2937;
    padding: 10px;
}

.block {
    background: #2563eb;
    padding: 10px;
    margin: 5px 0;
    cursor: pointer;
    text-align: center;
    border-radius: 6px;
}

.el {
    position: absolute;
    padding: 10px;
    background: #e5e7eb;
    color: black;
    cursor: move;
    border-radius: 5px;
}

input {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
}
button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    background: #22c55e;
    border: none;
    color: white;
    font-weight: bold;
}
</style>
</head>

<body>

<!-- LEFT PANEL -->
<div class="panel">
<h3>🧱 Eleman</h3>

<div class="block" onclick="add('button')">Button</div>
<div class="block" onclick="add('text')">Text</div>
<div class="block" onclick="add('box')">Box</div>

<button onclick="exportProject()">📦 Export APK Project</button>
</div>

<!-- CANVAS -->
<div class="canvas" id="canvas"></div>

<!-- PROPERTIES -->
<div class="prop">
<h3>⚙ Modify</h3>

<input id="txt" placeholder="Text">
<input id="color" placeholder="Color">
<button onclick="apply()">Apply</button>
</div>

<script>

let selected = null;

// ➕ ADD ELEMENT
function add(type){

let el = document.createElement("div");
el.className = "el";
el.innerText = type === "button" ? "Button" :
                type === "text" ? "Text" : "Box";

el.style.left = "50px";
el.style.top = "50px";

el.onclick = ()=>select(el);

// drag simple
el.onmousedown = function(e){
selected = el;

document.onmousemove = function(e){
el.style.left = e.pageX + "px";
el.style.top = e.pageY + "px";
}

document.onmouseup = function(){
document.onmousemove = null;
}
}

document.getElementById("canvas").appendChild(el);
}

// 🎯 SELECT ELEMENT
function select(el){
selected = el;
document.getElementById("txt").value = el.innerText;
document.getElementById("color").value = el.style.background || "";
}

// ⚙ APPLY MODIFICATION
function apply(){
if(!selected) return;

selected.innerText = document.getElementById("txt").value;
selected.style.background = document.getElementById("color").value;
}

// 📦 EXPORT PROJECT
function exportProject(){

let elements = document.querySelectorAll(".el");

let html = "<!DOCTYPE html><html><body>";

elements.forEach(e=>{
html += `<div style="
position:absolute;
left:${e.style.left};
top:${e.style.top};
background:${e.style.background};
padding:10px;
">${e.innerText}</div>`;
});

html += "</body></html>";

let blob = new Blob([html], {type:"text/html"});
let a = document.createElement("a");
a.href = URL.createObjectURL(blob);
a.download = "EroDev_App.html";
a.click();
}

</script>

</body>
</html>
