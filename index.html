<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EroDev Ultra Pro</title>

<link rel="manifest" href="manifest.json">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #050b18;
    color: white;
}

header {
    background: linear-gradient(90deg,#2563eb,#7c3aed,#22c55e);
    padding: 15px;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
}

.container {
    display: flex;
    height: calc(100vh - 60px);
}

.panel {
    width: 50%;
    padding: 10px;
    box-sizing: border-box;
}

textarea {
    width: 100%;
    height: 120px;
    margin-top: 10px;
    border-radius: 8px;
    border: none;
    padding: 10px;
    background: #111827;
    color: white;
}

input, button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    border-radius: 8px;
    border: none;
}

button {
    background: #22c55e;
    font-weight: bold;
    cursor: pointer;
}

iframe {
    width: 100%;
    height: 100%;
    border: none;
    background: white;
    border-radius: 10px;
}

.list {
    margin-top: 10px;
    font-size: 13px;
}

.item {
    background: #1e293b;
    padding: 8px;
    margin-top: 5px;
    border-radius: 6px;
    cursor: pointer;
}
</style>
</head>

<body>

<header>⚡ ERODEV ULTRA PRO BUILDER</header>

<div class="container">

<!-- LEFT -->
<div class="panel">

<input id="appName" placeholder="📱 App Name">
<input id="pkg" placeholder="📦 Package (com.erodev.app)">

<textarea id="html" placeholder="HTML"></textarea>
<textarea id="css" placeholder="CSS"></textarea>
<textarea id="js" placeholder="JS"></textarea>

<button onclick="preview()">👁 Preview</button>
<button onclick="save()">💾 Save Project</button>
<button onclick="exportZIP()">📦 Export APK Project</button>

<div class="list" id="list"></div>

</div>

<!-- RIGHT -->
<div class="panel">
<iframe id="frame"></iframe>
</div>

</div>

<script>

let projects = JSON.parse(localStorage.getItem("ultra_projects") || "[]");

// 👁 PREVIEW
function preview(){
let h = html.value;
let c = "<style>"+css.value+"</style>";
let j = "<script>"+js.value+"<\/script>";

let doc = document.getElementById("frame").contentWindow.document;
doc.open();
doc.write(h + c + j);
doc.close();
}

// 💾 SAVE
function save(){
let name = appName.value || "App";

projects.push({
name,
html: html.value,
css: css.value,
js: js.value
});

localStorage.setItem("ultra_projects", JSON.stringify(projects));
load();
}

// 📂 LOAD
function load(){
let list = document.getElementById("list");
list.innerHTML = "<b>📂 Projects</b>";

projects.forEach((p,i)=>{
let div = document.createElement("div");
div.className = "item";
div.innerText = p.name;

div.onclick = ()=>{
html.value = p.html;
css.value = p.css;
js.value = p.js;
};

list.appendChild(div);
});
}

load();

// 📦 EXPORT ZIP
function exportZIP(){

let name = appName.value || "EroApp";
let pkgName = pkg.value || "com.erodev.app";

let zip = new JSZip();

zip.file("config.xml", `
<widget id="${pkgName}">
  <name>${name}</name>
  <content src="www/index.html"/>
</widget>
`);

zip.file("www/index.html", `
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>${name}</title>
<style>${css.value}</style>
</head>
<body>
${html.value}
<script>${js.value}<\/script>
</body>
</html>
`);

zip.file("BUILD.txt", `
Use Capacitor:
npx cap add android
npx cap open android

OR Cordova:
cordova build android
`);

zip.generateAsync({type:"blob"}).then(blob=>{
let a = document.createElement("a");
a.href = URL.createObjectURL(blob);
a.download = name+"_ULTRA_PRO.zip";
a.click();
});

}

// 🔥 PWA AUTO REGISTER
if ("serviceWorker" in navigator){
navigator.serviceWorker.register("sw.js");
}

</script>

</body>
</html>
