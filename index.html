<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRO EroDev APK Builder</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0b1220;
    color: white;
}

header {
    background: linear-gradient(90deg,#2563eb,#22c55e);
    padding: 15px;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
}

.container {
    display: flex;
    height: calc(100vh - 60px);
}

.left, .right {
    width: 50%;
    padding: 10px;
    box-sizing: border-box;
}

input, textarea, button {
    width: 100%;
    margin-top: 10px;
    padding: 10px;
    border-radius: 8px;
    border: none;
}

textarea {
    height: 150px;
    background: #111827;
    color: white;
}

button {
    background: #22c55e;
    font-weight: bold;
    cursor: pointer;
}

.preview {
    background: white;
    height: 100%;
    border-radius: 10px;
}
.small {
    font-size: 12px;
    opacity: 0.7;
}
</style>
</head>

<body>

<header>⚡ PRO EroDev APK Builder</header>

<div class="container">

<!-- LEFT PANEL -->
<div class="left">

<input id="appName" placeholder="📱 Non App">
<input id="packageName" placeholder="📦 Package (com.erodev.app)">
<input id="icon" placeholder="🔗 Icon URL (opsyonèl)">

<p class="small">Mete HTML app ou:</p>
<textarea id="htmlCode"><h1>🔥 My First Pro App</h1></textarea>

<p class="small">CSS (opsyonèl):</p>
<textarea id="cssCode">body{font-family:Arial;text-align:center;}</textarea>

<p class="small">JS (opsyonèl):</p>
<textarea id="jsCode">console.log("App Loaded");</textarea>

<button onclick="runPreview()">👁 Preview</button>
<button onclick="buildAPK()">📦 Generate APK Project (ZIP)</button>

</div>

<!-- RIGHT PANEL -->
<div class="right">
<iframe id="preview" class="preview"></iframe>
</div>

</div>

<script>

// 🔥 PREVIEW FUNCTION
function runPreview() {
let html = document.getElementById("htmlCode").value;
let css = "<style>" + document.getElementById("cssCode").value + "</style>";
let js = "<script>" + document.getElementById("jsCode").value + "<\/script>";

let doc = document.getElementById("preview").contentWindow.document;
doc.open();
doc.write(html + css + js);
doc.close();
}

// 📦 BUILD APK PROJECT
function buildAPK() {

let name = document.getElementById("appName").value || "EroApp";
let pkg = document.getElementById("packageName").value || "com.erodev.app";

let html = document.getElementById("htmlCode").value;
let css = document.getElementById("cssCode").value;
let js = document.getElementById("jsCode").value;

let zip = new JSZip();

// 📁 config.xml (Cordova style)
zip.file("config.xml", `
<widget id="${pkg}" version="1.0.0">
  <name>${name}</name>
  <content src="www/index.html"/>
</widget>
`);

// 📁 index.html app
zip.file("www/index.html", `
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${name}</title>
<style>${css}</style>
</head>
<body>

${html}

<script>${js}<\/script>

</body>
</html>
`);

// 📁 README (APK guide)
zip.file("HOW_TO_BUILD_APK.txt", `
PRO EroDev APK Builder

1. Install Node.js
2. npm install -g cordova
3. cordova create ${name}
4. Replace www folder with this project
5. Run: cordova build android

OR use:
- Capacitor (recommended modern way)
- npx cap add android
- npx cap open android
`);

zip.generateAsync({type:"blob"}).then(function(content){
let a = document.createElement("a");
a.href = URL.createObjectURL(content);
a.download = name + "_PRO_EroDev.zip";
a.click();
});

}

</script>

</body>
</html>
